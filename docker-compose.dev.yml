# Desenvolvimento local: só as dependências. API, worker, IA Core e frontend rodam na máquina (hot reload).
# make dev-deps && make migrate seed && make dev   (ver README)
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: citadel, POSTGRES_PASSWORD: citadel, POSTGRES_DB: citadel }
    ports: ["5432:5432"]
    volumes: [pgdev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodev:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    profiles: [av]
volumes: { pgdev: {}, miniodev: {} }
