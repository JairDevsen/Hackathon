server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 "ok"; }
  location = /config.js { add_header Cache-Control "no-store" always; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location /demo/ { add_header Cache-Control "public, max-age=86400" always; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
